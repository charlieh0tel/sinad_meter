[project]
name = "sinad-meter"
version = "0.1.0"
description = "A software SINAD meter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pydwf",
    "python-vxi11>=0.9",
    "pyvisa",
    "pyvisa-py[serial]>=0.8.1",
    "registries",
    "scipy",
    "sounddevice",
    "standard-xdrlib>=3.13.0 ; python_full_version >= '3.13'",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pre-commit", "ruff"]
