[project]
name = "sinad-meter"
version = "0.1.0"
description = "A software SINAD meter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pydwf",
    "python-vxi11>=0.9",
    "pyvisa",
    "pyvisa-py[serial]>=0.8.1",
    "registries",
    "scipy",
    "sounddevice",
    "standard-xdrlib>=3.13.0 ; python_full_version >= '3.13'",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "prek",
    "pytest>=9.1.1",
    "ruff",
]

[tool.pytest.ini_options]
# The modules under test live at the repo root, not in a package.
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # python-vxi11 0.9 (latest) imports the deprecated stdlib xdrlib.
    "ignore:'xdrlib' is deprecated:DeprecationWarning:vxi11.rpc",
    # On 3.13+, where xdrlib is gone, the standard-xdrlib backport warns instead.
    "ignore:xdrlib was removed:DeprecationWarning:vxi11.rpc",
    # ...and has a non-raw regex in vxi11.py, flagged when it is compiled.
    # Compile-time warnings report the file path as the module.
    # The category is omitted because it is a DeprecationWarning before 3.12.
    "ignore:invalid escape sequence::.*/vxi11/vxi11",
]
