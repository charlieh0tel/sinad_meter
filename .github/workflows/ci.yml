name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor; 3.13 is where the stdlib lost xdrlib,
        # which is what the standard-xdrlib marker in pyproject.toml covers.
        # 3.14 reworded the invalid escape warning the test filters ignore.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    uses: charlieh0tel/deb-workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: ${{ matrix.python-version }}
      # sounddevice installs from PyPI but raises OSError at import unless the
      # PortAudio shared library is present, and the runner image lacks it.
      system-packages: libportaudio2
      # The suite imports every module, so it also covers a missing dependency
      # or a backend that stopped loading.
      test-command: pytest -q
      # This is a uv project, so pip-audit runs against the locked project
      # environment and nothing else -- none of the runner image's own
      # packages, which is why the shared workflow leaves it off by default.
      audit-command: pip-audit

  # python-ci.yml has no type-check step, and borrowing its lint-command
  # for mypy would drop ruff check.  One Python is enough: mypy checks
  # against requires-python's floor whatever interpreter runs it.
  mypy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # auto_sinad imports the instruments submodule's drivers.
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # --strict on the command line as well as in pyproject.toml, so that
      # dropping it from the config cannot quietly weaken the check.
      - run: uv run --frozen mypy --strict
