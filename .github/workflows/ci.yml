name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor; 3.13 is where the stdlib lost xdrlib,
        # which is what the standard-xdrlib marker in pyproject.toml covers.
        python-version: ["3.11", "3.12", "3.13"]
    uses: charlieh0tel/deb-workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: ${{ matrix.python-version }}
      # sounddevice installs from PyPI but raises OSError at import unless the
      # PortAudio shared library is present, and the runner image lacks it.
      system-packages: libportaudio2
      # The suite imports every module, so it also covers a missing dependency
      # or a backend that stopped loading.
      test-command: pytest -q
